<!doctype html>
<html lang="en" class="dark">
  <head>
    <script>
      (function () {
        if (location.pathname !== '/') return;
        var stored = null;
        try { stored = localStorage.getItem('leodeng:locale'); } catch (_) {}
        var primaryLanguage = navigator.languages && navigator.languages.length
          ? navigator.languages[0]
          : navigator.language || '';
        var preferred = stored === 'en' || stored === 'zh'
          ? stored
          : String(primaryLanguage).toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
        if (preferred === 'zh') location.replace('/zh' + location.search + location.hash);
      })();
    </script>
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var dark = stored ? stored === 'dark' : !window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
